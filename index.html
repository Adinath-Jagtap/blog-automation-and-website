<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timelesss Updates - News, Latest Stories & Daily Updates</title>
    <meta name="description" content="Your trusted source for breaking news and timeless stories. Get daily updates on world events, technology, business, and more. Professional journalism you can rely on.">
    <meta name="keywords" content="news, breaking news, latest news, world news, daily updates, current events, journalism, timelesss updates, headlines, stories">
    <meta name="google-site-verification" content="xLPntKv98Ss_Zt_0afEDX_MUaCaorNkIqSC4PLkT0xY" />
    <meta name="google-adsense-account" content="ca-pub-2200531077153999">
    <link rel="icon" type="image/png" href="https://timelesss-updates.netlify.app/css/logo.png">
    <link rel="apple-touch-icon" href="https://timelesss-updates.netlify.app/css/logo.png">
    <link rel="canonical" href="https://timelesss-updates.netlify.app/">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2200531077153999" crossorigin="anonymous"></script>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://timelesss-updates.netlify.app/">
    <meta property="og:title" content="Timelesss Updates - Your Source for Timeless News">
    <meta property="og:description" content="Stay informed with Timelesss Updates. Professional news coverage, updated daily with the stories that matter.">
    <meta property="og:image" content="https://timelesss-updates.netlify.app/css/logo.png">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://timelesss-updates.netlify.app/">
    <meta property="twitter:title" content="Timelesss Updates - Your Source for Timeless News">
    <meta property="twitter:description" content="Stay informed with Timelesss Updates. Professional news coverage, updated daily with the stories that matter.">
    <meta property="twitter:image" content="https://timelesss-updates.netlify.app/css/logo.png">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-top">
                <div class="logo-section">
                    <div class="logo-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                            <path d="M13 4L4 14H12L11 20L20 10H12L13 4Z" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h1>Timelesss Updates</h1>
                </div>
                <div class="header-right">
                    <div class="header-date">
                        <span id="current-date"></span>
                    </div>
                    <div class="search-wrapper">
                        <input
                            type="text"
                            class="search-input"
                            id="search-input"
                            placeholder="Search articles…"
                            autocomplete="off"
                            spellcheck="false"
                        />
                        <span class="search-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="7"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                        </span>
                    </div>
                </div>
            </div>
            <div class="header-rule">
                <span class="header-rule-text">Est. 2026</span>
            </div>
        </div>
    </header>

    <div class="container">

        <!-- HERO: shown when articles loaded -->
        <section class="hero-section" id="hero-section">
            <div class="hero-label">Featured Story</div>
            <div class="hero-grid">
                <div class="hero-main">
                    <div class="hero-main-title" id="hero-title"></div>
                    <p class="hero-summary" id="hero-summary"></p>
                    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
                        <button class="hero-read-btn" id="hero-read-btn">
                            Read Article
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                            </svg>
                        </button>
                        <div class="hero-meta">
                            <span id="hero-date"></span>
                            <span>·</span>
                            <span id="hero-source"></span>
                        </div>
                    </div>
                </div>
                <div class="hero-secondary-stack" id="hero-secondary"></div>
            </div>
        </section>

        <!-- Skeleton for hero -->
        <div id="hero-skeleton" class="skeleton-hero" style="display:none;">
            <div>
                <div class="skeleton-hero-title"></div>
                <div class="skeleton-hero-title narrow"></div>
                <div class="skeleton-text" style="margin-top:20px;height:16px;"></div>
                <div class="skeleton-text" style="height:16px;width:80%;"></div>
            </div>
            <div style="border-left:1px solid var(--border-warm);padding-left:48px;">
                <div class="skeleton-text" style="height:14px;margin-bottom:18px;width:90%;"></div>
                <div class="skeleton-text" style="height:14px;margin-bottom:18px;width:75%;"></div>
                <div class="skeleton-text" style="height:14px;width:85%;"></div>
            </div>
        </div>

    </div>

    <main class="container">

        <div id="section-heading-wrapper" style="display:none;">
            <div class="section-heading">
                <h2>All Stories</h2>
            </div>
        </div>

        <div id="loading">
            <div class="skeleton-grid">
                <div class="skeleton-card">
                    <div class="skeleton-title"></div>
                    <div class="skeleton-text"></div>
                    <div class="skeleton-text"></div>
                    <div class="skeleton-footer"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-title"></div>
                    <div class="skeleton-text"></div>
                    <div class="skeleton-text"></div>
                    <div class="skeleton-footer"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-title"></div>
                    <div class="skeleton-text"></div>
                    <div class="skeleton-text"></div>
                    <div class="skeleton-footer"></div>
                </div>
            </div>
        </div>

        <div id="articles-grid"></div>
        <p class="no-results" id="no-results">No articles match your search.</p>

        <div id="error" style="display:none;">
            <p>Unable to load articles. Please try again later.</p>
        </div>

    </main>

    <footer>
        <div class="container">
            <div class="footer-inner">

                <div class="footer-brand-rule">
                    <span class="footer-brand-name">Timelesss Updates</span>
                </div>

                <div class="footer-avatar-wrap">
                    <img src="css/yt.png" alt="Adinath Jagtap" class="footer-avatar" />
                </div>

                <div class="footer-creator-name">Adinath Jagtap</div>
                <div class="footer-creator-tag">Creator &amp; Developer</div>

                <div class="footer-socials">
                    <a href="https://www.youtube.com/@iitian_techLab" target="_blank" rel="noopener" class="footer-social-link yt">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.54 3.5 12 3.5 12 3.5s-7.54 0-9.38.55A3.02 3.02 0 0 0 .5 6.19C0 8.04 0 12 0 12s0 3.96.5 5.81a3.02 3.02 0 0 0 2.12 2.14C4.46 20.5 12 20.5 12 20.5s7.54 0 9.38-.55a3.02 3.02 0 0 0 2.12-2.14C24 15.96 24 12 24 12s0-3.96-.5-5.81zM9.75 15.5v-7l6.5 3.5-6.5 3.5z"/>
                        </svg>
                        YouTube
                    </a>
                    <a href="https://github.com/Adinath-Jagtap" target="_blank" rel="noopener" class="footer-social-link gh">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/>
                        </svg>
                        GitHub
                    </a>
                </div>

                <div class="footer-copy">&copy; 2026 Timelesss Updates. All rights reserved.</div>

            </div>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
    </script>
</body>
</html>
